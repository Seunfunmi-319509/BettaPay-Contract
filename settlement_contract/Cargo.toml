[package]
name = "settlement_contract"
version = "0.1.0"
description = "Soroban smart contract for merchant registration, fee splits, and payment references on Stellar"
license.workspace = true
edition.workspace = true
repository = "https://github.com/Betta-Pay/BettaPay-Contract"
readme = "README.md"
keywords = ["soroban", "stellar", "smart-contract", "payment", "settlement"]
categories = ["cryptography::cryptocurrency", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
