name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM release binaries
        run: cargo build --target wasm32-unknown-unknown --release

  build:
    name: Build Release Artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Build WASM release binaries
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/wasm32-unknown-unknown/release/settlement_contract.wasm artifacts/
          cp target/wasm32-unknown-unknown/release/governance_contract.wasm artifacts/

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.wasm > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
